<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#191919" />
    <title>Arcana</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
        }
        body {
            position: fixed;
            inset: 0;
            min-height: 100dvh;
            background: rgb(25, 25, 25);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            position: fixed;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
            box-sizing: border-box;
            touch-action: none;
        }
        #arcana-name-editor {
            position: fixed;
            z-index: 1000;
            top: calc(env(safe-area-inset-top, 0px) + 72px);
            left: 50%;
            width: min(90vw, 420px);
            min-height: 52px;
            padding: 7px;
            transform: translateX(-50%);
            display: flex;
            gap: 7px;
            border: 2px solid rgb(216, 187, 117);
            border-radius: 8px;
            box-sizing: border-box;
            background: rgba(25, 22, 30, 0.97);
            box-shadow: 0 5px 24px rgba(0, 0, 0, 0.55);
            touch-action: manipulation;
        }
        #arcana-name-editor[hidden] {
            display: none;
        }
        #arcana-character-name {
            min-width: 0;
            flex: 1;
            padding: 8px 10px;
            border: 1px solid rgb(216, 187, 117);
            border-radius: 5px;
            outline: none;
            color: white;
            background: rgb(43, 39, 52);
            font: 16px system-ui, sans-serif;
            touch-action: manipulation;
            -webkit-user-select: text;
            user-select: text;
        }
        #arcana-name-done {
            padding: 8px 13px;
            border: 1px solid rgb(216, 187, 117);
            border-radius: 5px;
            color: white;
            background: rgb(74, 62, 82);
            font: 600 16px system-ui, sans-serif;
            touch-action: manipulation;
        }
        .loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border-top: 16px solid #3498db;
            width: 120px;
            height: 120px;
            position: absolute;
            z-index : -999;
            -webkit-animation: spin 2s linear infinite;
            animation: spin 2s linear infinite;
        }

        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loader"></div>
<canvas id="arcana"></canvas>
<div id="arcana-name-editor" hidden>
    <input
        id="arcana-character-name"
        type="text"
        maxlength="16"
        autocomplete="off"
        autocapitalize="words"
        enterkeyhint="done"
        aria-label="Character name"
        placeholder="Character name"
    />
    <button id="arcana-name-done" type="button">Done</button>
</div>
<script type="module">
    import init from './arcana.js';
    init().then(() => { document.querySelector('.loader').style.display = 'none'; });

    const nameEditor = document.querySelector('#arcana-name-editor');
    const nameInput = document.querySelector('#arcana-character-name');
    const nameDone = document.querySelector('#arcana-name-done');
    const closeNameEditor = () => {
        nameInput.blur();
        nameEditor.hidden = true;
    };
    nameDone.addEventListener('click', closeNameEditor);
    nameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            closeNameEditor();
        }
    });
</script>
</body>
</html>
